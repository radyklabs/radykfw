name: Tag merged release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Merge commit SHA of a release PR to recover
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-release:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'chore(release): ')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve merged release PR for recovery
        if: github.event_name == 'workflow_dispatch'
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "merge_sha must be a full Git commit SHA."
            exit 1
          fi

          pr_title="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .head.ref == \"dev\" and .merge_commit_sha == \"${MERGE_SHA}\") | .title")"
          if [[ ! "$pr_title" =~ ^chore\(release\):\ [0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The commit is not the merge commit of a valid release PR from dev to main."
            exit 1
          fi

          printf 'pr_title=%s\n' "$pr_title" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata at merge commit
        id: release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || inputs.merge_sha }}
          PR_TITLE: ${{ github.event.pull_request.title || steps.recovery.outputs.pr_title }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          git checkout --detach "$MERGE_SHA"

          python3 - "$MERGE_SHA" "$PR_TITLE" <<'PY'
          import datetime
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          merge_sha, pr_title = sys.argv[1:]
          plugin = Path("plugin.init.php").read_text(encoding="utf-8")
          changelog = Path("docs/CHANGELOG.md").read_text(encoding="utf-8")

          version_match = re.search(
              r"^\s*\*\s*Version:\s*(\d+\.\d+\.\d+)\s*$",
              plugin,
              re.MULTILINE,
          )
          if version_match is None:
              raise SystemExit("Could not read a SemVer plugin Version header.")
          version = version_match.group(1)
          tag = f"v{version}"

          if pr_title != f"chore(release): {version}":
              raise SystemExit("Release PR title must exactly match the plugin version.")

          lines = changelog.splitlines()
          try:
              unreleased_index = lines.index("## [Unreleased]")
          except ValueError:
              raise SystemExit("CHANGELOG.md is missing its [Unreleased] section.")

          release_match = None
          for line in lines[unreleased_index + 1:]:
              if line.startswith("## ["):
                  release_match = re.fullmatch(
                      r"## \[(\d+\.\d+\.\d+)\] - (\d{4}-\d{2}-\d{2})(?: .*)?",
                      line,
                  )
                  break

          if release_match is None or release_match.group(1) != version:
              raise SystemExit("The first dated changelog release must match the plugin version.")
          try:
              datetime.date.fromisoformat(release_match.group(2))
          except ValueError:
              raise SystemExit("The release date in CHANGELOG.md is invalid.")

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*"],
              text=True,
          ).splitlines()
          version_tags = []
          for existing_tag in tags:
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", existing_tag)
              if match:
                  version_tags.append((tuple(map(int, match.groups())), existing_tag))

          if tag in tags:
              raise SystemExit(f"Tag {tag} already exists; refusing to move or overwrite it.")
          if version_tags and tuple(map(int, version.split("."))) <= max(
              item[0] for item in version_tags
          ):
              raise SystemExit("Release version must be greater than every existing SemVer tag.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"merge_sha={merge_sha}\n")
          PY

      - name: Create and push annotated release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$MERGE_SHA"
          git push origin "refs/tags/$TAG"
